services:
    fpm:
        build:
            context: .
            dockerfile: Dockerfile.forge
            args:
                WWWUSER: '1001'
        working_dir: /var/www/html
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '.:/var/www/html'
        ports:
            - '127.0.0.1:9104:9000'
